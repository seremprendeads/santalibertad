```html
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estamos construyendo</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:20px;
  font-family:Arial,Helvetica,sans-serif;
  color:#fff;
  background:#0a0a0a;
}

.card{
  width:100%;
  max-width:700px;
  padding:70px 30px;
  text-align:center;
  background:#111;
  border:1px solid #292929;
  border-radius:25px;
  box-shadow:0 25px 70px #000;
}

.logo{
  margin-bottom:40px;
  font-size:15px;
  font-weight:bold;
  letter-spacing:4px;
}

.logo span{color:#ff6a00}

.badge{
  display:inline-block;
  margin-bottom:25px;
  padding:9px 16px;
  border:1px solid #663000;
  border-radius:30px;
  color:#ffad76;
  background:#1c1008;
  font-size:12px;
  font-weight:bold;
  text-transform:uppercase;
}

h1{
  font-size:clamp(42px,8vw,75px);
  line-height:1;
  letter-spacing:-3px;
}

h1 span{color:#ff6a00}

.intro{
  margin:28px auto 35px;
  color:#999;
  font-size:18px;
  line-height:1.6;
}

.progress{
  width:100%;
  max-width:430px;
  height:5px;
  margin:auto;
  overflow:hidden;
  border-radius:10px;
  background:#292929;
}

.progress-bar{
  width:65%;
  height:100%;
  background:#ff6a00;
  animation:cargar 3s infinite alternate;
}

.small{
  margin-top:15px;
  color:#666;
  font-size:13px;
}

.contact{
  margin-top:40px;
  padding-top:25px;
  border-top:1px solid #292929;
  color:#777;
  font-size:13px;
}

.contact a{
  display:inline-block;
  margin-left:5px;
  color:#fff;
  text-decoration:none;
}

.contact a:hover{color:#ff6a00}

footer{
  margin-top:30px;
  color:#555;
  font-size:11px;
}

@keyframes cargar{
  from{width:55%}
  to{width:80%}
}

@media(max-width:500px){
  .card{padding:50px 22px}
  .intro{font-size:16px}
  .contact a{display:block;margin:8px 0 0}
}
</style>
</head>

<body>

<main class="card">

 <!-- <div class="logo">
    TU<span>MARCA</span>
  </div>-->

  <div class="badge">
    ● Sitio en construcción
  </div>

 

  <p class="intro">
      Proximamente!!
  </p>

  <div class="progress">
    <div class="progress-bar"></div>
  </div>

  <p class="small">
    Estamos trabajando para ofrecerte una mejor experiencia.
  </p>

 

  <footer>
    © 2026 TU MARCA · Todos los derechos reservados
  </footer>

</main>

</body>
</html>
```
